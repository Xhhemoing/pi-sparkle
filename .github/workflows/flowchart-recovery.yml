name: Ubuntu batch diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.x
          cache: pnpm
      - run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Cold checker reproduction
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .agent_workspace/diagnostic | Out-Null
          $source = @'
          // Diagnostic only. Run from repository root with node --import tsx <this-file>.
          import { spawnSync } from 'node:child_process';
          import { copyFile, mkdir, mkdtemp, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { dirname, join, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const repo = resolve('.');
          const { runAuthorizedCommand } = await import(pathToFileURL(join(repo, 'src/execution/command-runner.ts')).href);
          if (process.platform !== 'linux') throw new Error('Linux is required for process-group diagnosis');
          const tsx = import.meta.resolve('tsx');
          const root = await mkdtemp(join(tmpdir(), 'sparkle-checker-repro-'));
          const originalKill = process.kill;
          const sources = [
            'src/development/recipe-check.ts',
            'src/development/work-items.ts',
            'src/execution/command-runner.ts',
            'src/domain/errors.ts'
          ];
          let observations = [];
          let failures = 0;
          let observationError;
          function observeGroup(group) {
            const ps = spawnSync('ps', ['-eo', 'pid,ppid,pgid,stat,comm'], {encoding:'utf8'});
            if (ps.status !== 0) {
              observationError ??= new Error(`ps failed: ${ps.status}: ${ps.stderr}`);
              return {group, error: observationError.message};
            }
            const members = ps.stdout.trim().split('\n').slice(1).map(line => line.trim().split(/\s+/))
              .filter(fields => Number(fields[2]) === group)
              .map(([pid,parent,pgid,state,...command]) => ({pid:Number(pid),parent:Number(parent),group:Number(pgid),state,command:command.join(' ')}));
            return {group,members};
          }
          function observedKill(pid, signal) {
            // Observe only after the real probe succeeded. Never synthesize a result.
            const result = originalKill.call(process, pid, signal);
            if (pid < 0 && signal === 0) observations.push(observeGroup(-pid));
            return result;
          }
          try {
            for (let iteration = 0; iteration < 30; iteration++) {
              const instrumented = iteration >= 5 && iteration < 25;
              process.kill = instrumented ? observedKill : originalKill;
              observations = [];
              const fixture = await mkdtemp(join(root, 'cold-'));
              for (const relative of sources) {
                const destination = join(fixture, relative);
                await mkdir(dirname(destination), {recursive:true});
                await copyFile(join(repo, relative), destination);
              }
              await writeFile(join(fixture, 'package.json'), JSON.stringify({type:'module'}), 'utf8');
              const recipes = [{id:'noop',command:process.execPath,args:['-e',''],verifierVersion:'diagnostic'}];
              const result = await runAuthorizedCommand({
                executable:process.execPath,
                args:['--import',tsx,join(fixture,'src/development/recipe-check.ts'),JSON.stringify(recipes)],
                cwd:fixture, env:{}, timeoutMs:10000, maxStdoutBytes:4096, maxStderrBytes:4096
              });
              if (!result.ok) failures++;
              console.log(JSON.stringify({iteration,instrumented,result,observations}));
              if (observationError) throw observationError;
            }
            console.log(JSON.stringify({summary:{iterations:30,failures,plainIterations:10,instrumentedIterations:20}}));
            if (failures > 0) process.exitCode = 1;
          } finally {
            process.kill = originalKill;
            // The sole deletion target is the path returned by this process's mkdtemp.
            await rm(root, {recursive:true,force:true,maxRetries:3});
          }
          '@
          Set-Content .agent_workspace/diagnostic/checker-repro.mjs -Value $source -Encoding UTF8
          node --import tsx .agent_workspace/diagnostic/checker-repro.mjs 2>&1 | Tee-Object -FilePath .agent_workspace/diagnostic/checker.log
          exit $LASTEXITCODE
      - name: Original batch tests
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm test -- --test-concurrency=1 test/integration/cli/development-batch-review.test.ts 2>&1 | Tee-Object -FilePath .agent_workspace/diagnostic/batch.log
          exit $LASTEXITCODE
      - name: Cold batch copies
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @'
          import { cp, mkdtemp, writeFile, symlink, rm } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          const repo = resolve('.');
          const tsx = import.meta.resolve('tsx');
          const root = await mkdtemp(join(tmpdir(), 'sparkle-cold-batch-'));
          let failures = 0;
          try {
            for (let iteration = 0; iteration < 8; iteration++) {
              const fixture = join(root, String(iteration));
              await cp(join(repo, 'src'), join(fixture, 'src'), {recursive:true});
              await cp(join(repo, 'test/integration/cli/development-batch-review.test.ts'), join(fixture, 'test/integration/cli/development-batch-review.test.ts'), {recursive:true});
              await writeFile(join(fixture, 'package.json'), JSON.stringify({type:'module'}), 'utf8');
              await symlink(join(repo, 'node_modules'), join(fixture, 'node_modules'), 'dir');
              const result = spawnSync(process.execPath, ['--import', tsx, '--test', '--test-name-pattern=fake batch retains', join(fixture,'test/integration/cli/development-batch-review.test.ts')], {cwd:fixture,encoding:'utf8',timeout:90000,maxBuffer:1024*1024});
              console.log(JSON.stringify({iteration,status:result.status,signal:result.signal,error:result.error?.message,stdout:result.stdout,stderr:result.stderr}));
              if (result.status !== 0) failures++;
            }
            console.log(JSON.stringify({summary:{iterations:8,failures}}));
            if (failures) process.exitCode = 1;
          } finally { await rm(root, {recursive:true,force:true,maxRetries:3}); }
          '@
          Set-Content .agent_workspace/diagnostic/batch-copies.mjs -Value $source -Encoding UTF8
          node .agent_workspace/diagnostic/batch-copies.mjs 2>&1 | Tee-Object -Encoding UTF8 -FilePath .agent_workspace/diagnostic/batch-copies.log
          exit $LASTEXITCODE
      - name: Command runner regressions
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm test -- --test-concurrency=1 test/unit/execution/command-runner.test.ts 2>&1 | Tee-Object -Encoding UTF8 -FilePath .agent_workspace/diagnostic/runner.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-batch-diagnosis
          path: .agent_workspace/diagnostic/*.log
          retention-days: 14
          include-hidden-files: true
