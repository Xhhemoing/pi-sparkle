name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22.19.x
            pi-version: 1.4.0
            runtime-version: 1.4.0
            full-suite: true
            check-name: quality (22.19.x)
          - node-version: 22.19.x
            pi-version: 1.2.0
            runtime-version: 1.2.0
            full-suite: true
            check-name: quality (22.19.x, Pi 1.2.0)
          - node-version: 22.19.x
            pi-version: 1.2.0
            runtime-version: 1.4.0
            full-suite: false
            check-name: quality (22.19.x, host Pi 1.2.0)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install pinned dependencies
        if: matrix.pi-version == '1.4.0'
        run: pnpm install --frozen-lockfile

      - name: Install minimum Pi compatibility candidate
        if: matrix.pi-version == '1.2.0'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ matrix.pi-version }}'
          $runtimeVersion = '${{ matrix.runtime-version }}'
          $package = Get-Content -LiteralPath package.json -Encoding UTF8 -Raw | ConvertFrom-Json -AsHashtable
          $package.dependencies['@earendil-works/pi-agent-core'] = $runtimeVersion
          $package.dependencies['@earendil-works/pi-ai'] = $runtimeVersion
          $package.devDependencies['@earendil-works/pi-coding-agent'] = $version
          $package.peerDependencies['@earendil-works/pi-coding-agent'] = $version
          # Pi 1.2 publishes caret dependencies; pin the entire Pi family so
          # the host cannot silently pick newer core/transitive packages. Exact
          # app pins remain separate in the mixed host/runtime lane.
          # pnpm reads overrides from the workspace configuration.
          $overrides = @('','overrides:')
          foreach ($name in @('pi-agent-core','pi-ai','pi-mcp','pi-tui','pi-codemode')) {
            $overrides += "  '@earendil-works/pi-coding-agent@${version}>@earendil-works/${name}': '${version}'"
          }
          $overrides += "  '@earendil-works/pi-agent-core@${version}>@earendil-works/pi-ai': '${version}'"
          $overrides += "  '@earendil-works/pi-ai@${version}>@earendil-works/pi-telemetry': '${version}'"
          Add-Content -LiteralPath pnpm-workspace.yaml -Value $overrides -Encoding UTF8
          $package | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath package.json -Encoding UTF8
          pnpm install --no-frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: No unresolved merge-conflict markers
        # Guards AI-assisted/auto-resolved landings: a conflict marker must
        # never reach main. Uses ^{7} repetition so this file does not
        # self-match the literal marker.
        run: |
          if grep -rnE '^<{7}|^>{7}' \
              --include='*.ts' --include='*.js' --include='*.mjs' \
              --include='*.json' --include='*.md' --include='*.yml' --include='*.yaml' \
              src test docs scripts examples prompts .github 2>/dev/null; then
            echo '::error::Unresolved merge-conflict markers found (see lines above)'
            exit 1
          fi

      - name: Workflow contract
        run: pnpm workflow:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        # Some historical-review regressions intentionally patch a prototype
        # for one read window; serialize the full suite so that host-level
        # evidence remains isolated across test files.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .agent_workspace/ci -Force | Out-Null
          pnpm list --depth Infinity --json | Set-Content -LiteralPath .agent_workspace/ci/dependencies.json -Encoding UTF8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compatibilityTests = @()
          if ('${{ matrix.full-suite }}' -eq 'false') {
            $compatibilityTests = @('test/integration/pi-adapter/host-compat.test.ts','test/unit/native/extension.test.ts')
          }
          pnpm test -- --test-concurrency=1 @compatibilityTests 2>&1 | Tee-Object -Encoding UTF8 -FilePath .agent_workspace/ci/tests.log
          exit $LASTEXITCODE

      - name: Build
        run: pnpm build

      - name: Security probe
        run: pnpm security:probe

      - name: Pi compatibility probe
        run: pnpm pi:probe

      - name: Kernel reuse probe
        run: pnpm kernel-reuse:probe

      - name: Built CLI version
        run: node dist/cli/main.js --version

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-node-${{ matrix.node-version }}-pi-${{ matrix.pi-version }}-runtime-${{ matrix.runtime-version }}
          path: |
            .agent_workspace/ci/*.log
            .agent_workspace/ci/dependencies.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.19.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CLI version and help
        run: pnpm cli version && pnpm cli help

      - name: Fake children and doctor
        run: pnpm test -- test/integration/m1/cli-children.test.ts test/unit/cli/doctor.test.ts

      - name: Development queue and controller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $developmentTests = @(
            'test/integration/cli/development.test.ts',
            'test/integration/cli/development-batch-review.test.ts',
            'test/integration/development/controller.test.ts',
            'test/integration/development/controller-admission.test.ts',
            'test/integration/development/controller-cancellation.test.ts',
            'test/integration/development/scoped-readiness.test.ts',
            'test/integration/development/start-task.test.ts',
            'test/integration/development/process-ownership.test.ts',
            'test/integration/development/work-item-cancellation.test.ts',
            'test/integration/development/batch.test.ts',
            'test/integration/development/source-integration.test.ts',
            'test/integration/development/recipe-limits.test.ts',
            'test/integration/development/candidate-review.test.ts',
            'test/integration/native/apply-registration-inputs.test.ts',
            'test/integration/native/trusted-apply.test.ts',
            'test/unit/development/batch.test.ts',
            'test/unit/development/action-admission.test.ts',
            'test/unit/architecture/boundary-cleanup.test.ts',
            'test/unit/architecture/compatibility-exports.test.ts',
            'test/unit/execution/loop-artifact-bounds.test.ts',
            'test/unit/execution/exact-git-tree.test.ts'
          )
          New-Item -ItemType Directory -Path .agent_workspace/ci -Force | Out-Null
          pnpm test -- --test-concurrency=1 @developmentTests 2>&1 | Tee-Object -Encoding UTF8 -FilePath .agent_workspace/ci/development.log
          exit $LASTEXITCODE

      - name: Native reliability and bounded persistence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $focusedTests = @(
            'test/unit/native/apply.test.ts',
            'test/integration/native/apply.test.ts',
            'test/unit/native/write-preflight.test.ts',
            'test/unit/native/session.test.ts',
            'test/integration/native/write-loop.test.ts',
            'test/unit/execution/command-runner.test.ts',
            'test/unit/pi-adapter/executor-fallback.test.ts',
            'test/unit/config/providers-config.test.ts',
            'test/unit/execution/paths.test.ts',
            'test/unit/pi-adapter/worktree-coding-tools.test.ts',
            'test/unit/pi-adapter/native-executor.test.ts',
            'test/unit/persist/jsonl.test.ts',
            'test/unit/persist/jsonl-offset.test.ts'
          )
          New-Item -ItemType Directory -Path .agent_workspace/ci -Force | Out-Null
          pnpm test -- --test-concurrency=1 @focusedTests 2>&1 | Tee-Object -Encoding UTF8 -FilePath .agent_workspace/ci/native.log
          exit $LASTEXITCODE

      - name: Conversation tools, recovery and controlled driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .agent_workspace/ci -Force | Out-Null
          $conversationTests = @(
            'test/unit/native/extension.test.ts',
            'test/unit/conversation/',
            'test/integration/conversation/',
            'test/integration/pi-adapter/managed-driver.test.ts',
            'test/integration/pi-adapter/managed-qualification.test.ts'
          )
          pnpm test -- --test-concurrency=1 @conversationTests 2>&1 | Tee-Object -Encoding UTF8 -FilePath .agent_workspace/ci/conversation.log
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: .agent_workspace/ci/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
